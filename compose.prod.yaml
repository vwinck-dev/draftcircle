name: draftcircle-prod

x-production-build: &production-build
  context: .
  target: production
  args:
    VITE_APP_NAME: ${APP_NAME:-DraftCircle}
    VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
    VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST in .env.production}
    VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
    VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
  BROADCAST_CONNECTION: reverb
  DB_HOST: mysql
  DB_ROOT_PASSWORD: ""
  LOG_CHANNEL: stderr
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
  REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID in .env.production}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env.production}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http

x-php-service: &php-service
  image: ${APP_IMAGE:-draftcircle-app:latest}
  build: *production-build
  env_file:
    - path: .env.production
      required: true
  environment: *app-environment
  volumes:
    - app_cache:/var/www/html/bootstrap/cache
    - app_storage:/var/www/html/storage
  read_only: true
  tmpfs:
    - /tmp
  init: true
  restart: unless-stopped
  networks:
    - backend
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php-service
    environment:
      <<: *app-environment
      APP_OPTIMIZE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: ${NGINX_IMAGE:-draftcircle-nginx:latest}
    build:
      context: .
      target: nginx-production
      args:
        VITE_APP_NAME: ${APP_NAME:-DraftCircle}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST in .env.production}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
    volumes:
      - app_storage:/var/www/html/storage:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    init: true
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 5

  horizon:
    <<: *php-service
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *php-service
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    <<: *php-service
    command:
      [
        "php",
        "artisan",
        "reverb:start",
        "--host=0.0.0.0",
        "--port=8080",
      ]
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$s=@fsockopen('127.0.0.1',8080); exit($$s ? 0 : 1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    <<: *php-service
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    profiles: ["deploy"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:

volumes:
  app_cache:
  app_storage:
  mysql_data:
  redis_data:
