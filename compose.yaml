name: draftcircle-dev

x-php-service: &php-service
  image: draftcircle-dev-app:latest
  build:
    context: .
    target: development
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  env_file:
    - path: .env
      required: true
  environment: &app-environment
    APP_ENV: local
    APP_DEBUG: "true"
    BROADCAST_CONNECTION: reverb
    DB_HOST: mysql
    MAIL_HOST: mailpit
    REDIS_HOST: redis
    REVERB_APP_ID: ${REVERB_APP_ID:-draftcircle}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-draftcircle-local-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-draftcircle-local-secret}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  tmpfs:
    - /tmp
  init: true
  networks:
    - backend
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php-service
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  attacker:
    build:
      context: ./docker/attacker
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_HTTP_PORT:-80}:8080"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/demo/default-vulnerable.conf:ro
      - ./docker/nginx/events-vulnerable.conf:/etc/nginx/demo/events-vulnerable.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /etc/nginx/conf.d
      - /etc/nginx/runtime
    command:
      [
        "/bin/sh",
        "-c",
        "cp /etc/nginx/demo/default-vulnerable.conf /etc/nginx/conf.d/default.conf && cp /etc/nginx/demo/events-vulnerable.conf /etc/nginx/runtime/events.conf && exec nginx -g 'daemon off;'",
      ]
    init: true
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 5

  vite:
    build:
      context: .
      target: frontend-development
    environment:
      VITE_APP_NAME: ${APP_NAME:-DraftCircle}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_HMR_PORT: ${VITE_FORWARD_PORT:-5173}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-draftcircle-local-key}
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: ${APP_HTTP_PORT:-80}
      VITE_REVERB_SCHEME: http
    ports:
      - "${VITE_FORWARD_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    init: true
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(5173,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  horizon:
    <<: *php-service
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *php-service
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    <<: *php-service
    command:
      [
        "php",
        "artisan",
        "reverb:start",
        "--host=0.0.0.0",
        "--port=8080",
        "--debug",
      ]
    ports:
      - "${REVERB_FORWARD_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$s=@fsockopen('127.0.0.1',8080); exit($$s ? 0 : 1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mysql:
    image: mysql:8.4
    command: ["--disable-log-bin"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-draftcircle}
      MYSQL_USER: ${DB_USERNAME:-draftcircle}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "${MYSQL_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    tmpfs:
      - /data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_FORWARD_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_FORWARD_PORT:-8025}:8025"
    networks:
      - backend

networks:
  backend:

volumes:
  mysql_data:
  node_modules:
  vendor:
